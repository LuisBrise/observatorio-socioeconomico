- id: bie.pobreza.internacional.linea_300
  nombre: Pobreza extrema internacional (US$3.00 diarios, PPA 2021)
  concepto: bie.pobreza.monetaria_internacional
  definicion: Porcentaje de la población que vive en hogares con ingreso (o consumo) per cápita diario menor a la
    línea, en dólares de PPA de 2021. US$3.00 es la línea internacional de pobreza extrema (mediana de las líneas
    nacionales de países de ingreso bajo).
  unidad: '% de la población'
  facetas:
    tipo_medicion: encuesta
    cadena: resultado
    ritmo: intermedio
    direccion_normativa: menos_es_mejor
    cobertura:
    - mundo
  series:
  - wb_pip:pobreza_3.00.ingreso.nacional
  - wb_pip:pobreza_3.00.ingreso.urbano
  - wb_pip:pobreza_3.00.consumo.nacional
  - wb_pip:pobreza_3.00.consumo.urbano
  rangos_validos:
    min: 0
    max: 100
  atipicos:
    z: 6.0
    cambio_minimo: 0.7
    piso: 5.0
  notas_interpretacion: Línea pensada para países de ingreso bajo; en México y gran parte de ALC afecta a una fracción
    pequeña.
  preguntas:
  - D1
  fecha_alta: '2026-10-05'
