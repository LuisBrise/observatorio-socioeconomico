- id: bie.desigualdad.ingreso.gini_encuestas
  nombre: Índice de Gini (encuestas de hogares)
  concepto: bie.desigualdad.ingreso
  definicion: 'Concentración del ingreso (o consumo) per cápita entre personas: 0 = igualdad total, 100 = una persona
    concentra todo.'
  unidad: índice de Gini (0-100)
  facetas:
    tipo_medicion: encuesta
    cadena: resultado
    ritmo: intermedio
    direccion_normativa: en_disputa
    cobertura:
    - mundo
  series:
  - wb_pip:gini.ingreso.nacional
  - wb_pip:gini.ingreso.urbano
  - wb_pip:gini.consumo.nacional
  - wb_pip:gini.consumo.urbano
  rangos_validos:
    min: 0
    max: 100
  atipicos:
    z: 6.0
    cambio_minimo: 0.15
  notas_interpretacion: 'Las encuestas captan mal los ingresos más altos: el Gini de encuestas subestima la concentración
    (ver WID para datos fiscales). Gini de ingreso y de consumo no son comparables. La dirección deseable de la
    desigualdad es un juicio normativo en disputa.'
  preguntas:
  - D1
  fecha_alta: '2026-10-05'
