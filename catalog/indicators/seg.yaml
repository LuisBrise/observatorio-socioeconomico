# Violencia letal. Las cifras representan personas: se publican solo agregados y con lenguaje sobrio.
- id: seg.violencia_letal.homicidio.defunciones
  nombre: Defunciones registradas por homicidio
  concepto: seg.violencia_letal.homicidio
  definicion: >
    Defunciones registradas en el año cuya causa básica en el certificado de defunción es homicidio
    (CIE-10 X85-Y09), según el año de registro.
  unidad: defunciones
  facetas:
    tipo_medicion: administrativo
    cadena: resultado
    ritmo: coyuntural
    direccion_normativa: menos_es_mejor
    cobertura: [mexico]
  series: [inegi_homicidios:Mortalidad_08.total]
  rangos_validos: {min: 0, max: 1000000}
  atipicos: {z: 6.0, cambio_minimo: 0.25}
  notas_interpretacion: >
    Es un registro de defunciones, no de delitos: no depende de que haya denuncia, pero sí de que
    el cuerpo sea localizado y la muerte certificada. Por año de registro, no de ocurrencia.
  preguntas: [D4]
  fecha_alta: 2026-10-06

