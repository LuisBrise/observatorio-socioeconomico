  series: [inegi_homicidios:Mortalidad_08.hombres]
  rangos_validos: {min: 0, max: 1000000}
  atipicos: {z: 6.0, cambio_minimo: 0.25}
  preguntas: [D4]
  fecha_alta: 2026-10-06

- id: seg.violencia_letal.homicidio.defunciones_mujeres
  nombre: Defunciones registradas por homicidio (mujeres)
  concepto: seg.violencia_letal.homicidio
  definicion: Defunciones de mujeres con causa básica de homicidio (CIE-10 X85-Y09), por año de registro.
  unidad: defunciones
  facetas: {tipo_medicion: administrativo, cadena: resultado, ritmo: coyuntural,
            direccion_normativa: menos_es_mejor, cobertura: [mexico]}
  series: [inegi_homicidios:Mortalidad_08.mujeres]
  rangos_validos: {min: 0, max: 1000000}
  atipicos: {z: 6.0, cambio_minimo: 0.25}
  notas_interpretacion: >
    No equivale a feminicidio: el feminicidio es un tipo penal (carpetas de investigación) que exige
    acreditar razones de género; aquí se cuentan todas las mujeres asesinadas según el certificado.
  preguntas: [D4]
  fecha_alta: 2026-10-06

- id: seg.violencia_letal.homicidio.defunciones_sexo_ne
  nombre: Defunciones registradas por homicidio (sexo no especificado)
  concepto: seg.violencia_letal.homicidio
  definicion: Defunciones por homicidio en las que el certificado no especifica el sexo.
  unidad: defunciones
  facetas: {tipo_medicion: administrativo, cadena: resultado, ritmo: coyuntural,
            direccion_normativa: neutral, cobertura: [mexico]}
  series: [inegi_homicidios:Mortalidad_08.no_especificado]
  rangos_validos: {min: 0, max: 1000000}
  atipicos: {z: 6.0, cambio_minimo: 1.0, piso: 1000}
  notas_interpretacion: Indicador de calidad del registro (suele crecer cuando aumentan los restos sin identificar).
