# Víctimas en carpetas de investigación (SESNSP).

- id: seg.violencia_letal.homicidio.victimas_doloso
  nombre: "Víctimas de homicidio doloso (SESNSP)"
  concepto: seg.violencia_letal.homicidio
  definicion: >
    Víctimas de homicidio doloso registradas en carpetas de investigación del fuero común, por año de inicio de la carpeta.
  unidad: víctimas
  facetas: {tipo_medicion: administrativo, cadena: resultado, ritmo: coyuntural,
            direccion_normativa: menos_es_mejor, cobertura: [mexico]}
  series: [sesnsp_victimas:homicidio_doloso.total]
  rangos_validos: {min: 0, max: 1000000}
  atipicos: {z: 6.0, cambio_minimo: 0.25, piso: 200}
  notas_interpretacion: >
    Víctimas en carpetas de investigación (fiscalías), no defunciones: depende de la denuncia y de la clasificación de cada fiscalía.
  preguntas: [D4]
  fecha_alta: 2026-10-06

