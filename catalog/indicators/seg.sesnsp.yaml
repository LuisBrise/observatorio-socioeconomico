- id: seg.violencia_letal.feminicidio.victimas
  nombre: "Víctimas de feminicidio (SESNSP)"
  concepto: seg.violencia_letal.feminicidio
  definicion: >
    Víctimas del delito de feminicidio en carpetas de investigación del fuero común (tipo penal que exige acreditar razones de género; su definición varía entre códigos penales estatales).
  unidad: víctimas
  facetas: {tipo_medicion: administrativo, cadena: resultado, ritmo: coyuntural,
            direccion_normativa: menos_es_mejor, cobertura: [mexico]}
  series: [sesnsp_victimas:feminicidio.total]
  rangos_validos: {min: 0, max: 1000000}
  atipicos: {z: 6.0, cambio_minimo: 0.25, piso: 200}
  notas_interpretacion: >
    Víctimas en carpetas de investigación (fiscalías), no defunciones: depende de la denuncia y de la clasificación de cada fiscalía. Su evolución mezcla cambios en la violencia y en la tipificación y aplicación del delito por cada fiscalía.
  preguntas: [D4]
  fecha_alta: 2026-10-06

- id: seg.violencia_letal.otros_contra_vida.victimas
  nombre: "Víctimas de otros delitos contra la vida y la integridad corporal (SESNSP)"
  concepto: seg.violencia_letal.otros_contra_vida
  definicion: >
    Víctimas registradas como 'otros delitos que atentan contra la vida y la integridad corporal' en carpetas de investigación del fuero común.
  unidad: víctimas
  facetas: {tipo_medicion: administrativo, cadena: resultado, ritmo: coyuntural,
            direccion_normativa: neutral, cobertura: [mexico]}
  series: [sesnsp_victimas:otros_contra_la_vida.total]
  rangos_validos: {min: 0, max: 1000000}
  atipicos: {z: 6.0, cambio_minimo: 0.25, piso: 200}
  notas_interpretacion: >
    Víctimas en carpetas de investigación (fiscalías), no defunciones: depende de la denuncia y de la clasificación de cada fiscalía. Se vigila porque un aumento puede reflejar reclasificación de muertes que antes se registraban como homicidio doloso.
  preguntas: [D4]
  fecha_alta: 2026-10-06
