- id: seg.violencia_letal.homicidio.victimas_doloso_mujeres
  nombre: "Víctimas de homicidio doloso: mujeres (SESNSP)"
  concepto: seg.violencia_letal.homicidio
  definicion: >
    Mujeres víctimas de homicidio doloso (no clasificado como feminicidio) en carpetas de investigación del fuero común.
  unidad: víctimas
  facetas: {tipo_medicion: administrativo, cadena: resultado, ritmo: coyuntural,
            direccion_normativa: menos_es_mejor, cobertura: [mexico]}
  series: [sesnsp_victimas:homicidio_doloso.mujer]
  rangos_validos: {min: 0, max: 1000000}
  atipicos: {z: 6.0, cambio_minimo: 0.25, piso: 200}
  notas_interpretacion: >
    Víctimas en carpetas de investigación (fiscalías), no defunciones: depende de la denuncia y de la clasificación de cada fiscalía. Un asesinato de una mujer se registra como feminicidio u homicidio doloso según la fiscalía acredite o no razones de género.
  preguntas: [D4]
  fecha_alta: 2026-10-06

