# Desapariciones (RNPDNO). Las cifras representan personas: solo agregados, lenguaje sobrio.

- id: seg.desapariciones.registro.desaparecidas
  nombre: "Personas desaparecidas y no localizadas (RNPDNO)"
  concepto: seg.desapariciones.registro
  definicion: >
    Personas cuyo registro sigue con estatus de desaparecida o no localizada en la fecha de consulta, por año de desaparición.
  unidad: personas
  facetas: {tipo_medicion: administrativo, cadena: resultado, ritmo: coyuntural,
            direccion_normativa: menos_es_mejor, cobertura: [mexico]}
  series: [rnpdno:desaparecidas.total]
  rangos_validos: {min: 0, max: 10000000}
  atipicos: {z: 6.0, cambio_minimo: 0.5, piso: 500}
  notas_interpretacion: >
    Instantánea de un registro administrativo vivo, por año de desaparición: los años recientes tienen menos tiempo para que las personas sean localizadas y los anteriores a 2019 están subregistrados. Compárense instantáneas de distintas fechas con cautela.
  preguntas: [D4]
  fecha_alta: 2026-10-06

