    - {id: int.flujos, nombre: Inversión y flujos financieros}
    - {id: int.cadenas, nombre: Cadenas de valor}
    - {id: int.mex_eeuu, nombre: Relación México–Estados Unidos}
    - {id: int.alc_mundo, nombre: ALC–China y ALC–Europa}
    - {id: int.diplomacia, nombre: Alineamiento diplomático}
    - {id: int.seguridad, nombre: Seguridad internacional}
    - {id: int.peso, nombre: Peso en el mundo}
- id: meta
  nombre: Calidad y capacidad estadística
  subdimensiones:
    - {id: meta.capacidad, nombre: Capacidad estadística}
    - {id: meta.apertura, nombre: Apertura de datos}
    - {id: meta.registros, nombre: Cobertura de registros}
