id: wid
nombre: World Inequality Database (extracto por país)
fuente: wil
conector: wid
url: https://wid.world/data/
acceso:
  metodo: descarga_masiva
  endpoint: https://wid.world/bulk_download/wid_all_data.zip
  credenciales: ninguna
  formato: zip con csv por país (extracción parcial por HTTP Range)
licencia:
  nombre: Acceso abierto con atribución (términos exactos por verificar)
  url: https://wid.world/
  redistribucion: permitida_con_atribucion
cobertura:
  geografica: 44 países seleccionados (ALC, contraste, EE.UU., Canadá)
  temporal: 1820– (años antiguos imputados)
  poblacion: Adultos de 20 años o más; ingreso repartido por igual entre cónyuges
frecuencia: anual (actualización anual de la base)
rezago_tipico_dias: 365
calendario: Actualización anual (la versión vigente se identifica por la fecha de modificación del ZIP).
metodologia: https://wid.world/methodology/
revisiones: Cada actualización puede revisar series completas.
limitaciones: 'Ingreso nacional antes de impuestos (incluye ingresos no reportados en encuestas y utilidades no
  distribuidas imputadas a sus dueños): concepto distinto del ingreso per cápita del hogar de las encuestas. Los
  años sin fuentes se rellenan (data_quality <= 1): en México, 1980–2002 y 2023–2024 repiten el valor más cercano;
  se marcan como imputados (I) y no deben leerse como mediciones.'
rupturas_conocidas: []
