cobertura:
  geografica: Nacional (y entidades federativas en otras hojas)
  temporal: 2016–2024 (bienal)
  poblacion: Población residente en viviendas particulares (ENIGH)
frecuencia: bienal
rezago_tipico_dias: 225
calendario: Agosto del año siguiente al levantamiento de la ENIGH (2024 publicado el 13/08/2025).
metodologia: https://www.inegi.org.mx/contenidos/desarrollosocial/pm/doc/pm_nota_tecnica_2024.pdf
revisiones: La serie 2016–2022 proviene de CONEVAL; 2024 de INEGI con la misma metodología. La serie 2008–2014 (MCS-ENIGH)
  es un tramo comparable distinto y no está incluida.
limitaciones: 'Solo tiene intervalos de confianza para el último año en este archivo; para 2016–2022 las pruebas
  de hipótesis están en los anexos del CONEVAL. La medición depende de la ENIGH (subdeclaración de ingresos altos;
  cambios de cuestionario). El aumento de la carencia por acceso a servicios de salud entre 2018 y 2022 coincide
  con el cambio de esquema de afiliación (fin del Seguro Popular en 2020): refleja el criterio de medición de la
  adscripción, que conviene leer con su nota metodológica.'
