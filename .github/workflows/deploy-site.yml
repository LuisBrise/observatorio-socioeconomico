# Construye el sitio desde los vintages fijados y lo publica en GitHub Pages.
name: Publicar sitio
on:
  push:
    # La rama principal del repositorio (hoy claude/brave-goldberg-gapsii) y main si se crea.
    branches: [main, claude/brave-goldberg-gapsii]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: scripts/raw_archive.sh restore
      - run: uv run obs rebuild
      - run: make viz
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release   # fijar una versión concreta tras la primera compilación exitosa
      - run: quarto render site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
