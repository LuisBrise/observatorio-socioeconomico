[project]
name = "observatorio"
version = "0.1.0"
description = "Observatorio socioeconómico y político: pipeline reproducible de datos, análisis y visualización."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "fastexcel>=0.21.0",
  "httpx>=0.27",
  "pandera[polars]>=0.20",
  "polars>=1.10",
  "pyarrow>=17",
  "pycountry>=24.6",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "tenacity>=9.0",
  "typer>=0.12",
]

[project.scripts]
obs = "observatorio.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "xlsxwriter>=3.2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observatorio"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
